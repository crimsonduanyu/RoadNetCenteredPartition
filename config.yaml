study_area:
  active: "fifth_ring"
  center_point:
    lon: 116.4074
    lat: 39.9042
  scopes:
    fifth_ring:
      label: "Fifth Ring"
      raw_edges_path: "data/raw/beijing_edges_raw.gpkg"
      raw_nodes_path: "data/raw/beijing_nodes_raw.gpkg"
      graphml_path: "data/raw/beijing_drive_within_fifth_ring.graphml"
      boundary_path: "data/raw/beijing_fifth_ring_boundary.gpkg"
      ring_segments_path: "data/raw/beijing_fifth_ring_segments.gpkg"
      harvest_bbox:
        north: 40.08
        south: 39.75
        east: 116.62
        west: 116.15
      ring_name_patterns:
        - "东五环"
        - "西五环"
        - "南五环"
        - "北五环"
      exclude_name_patterns:
        - "辅路"
      retain_boundary_roads: true
      min_ring_segment_count: 100
      min_ring_total_length_km: 80
      min_ring_span_km: 20
      min_boundary_area_km2: 500
      max_boundary_area_km2: 800
      boundary_buffer_m: 80
      inside_length_ratio_threshold: 0.98
      boundary_tolerance_m: 5
      ring_overlap_tolerance_m: 20
    fourth_ring:
      label: "Fourth Ring"
      raw_edges_path: "data/raw/beijing_edges_raw.gpkg"
      raw_nodes_path: "data/raw/beijing_nodes_raw.gpkg"
      graphml_path: "data/raw/beijing_drive_within_fifth_ring.graphml"
      boundary_path: "data/raw/beijing_fourth_ring_boundary.gpkg"
      ring_segments_path: "data/raw/beijing_fourth_ring_segments.gpkg"
      harvest_bbox:
        north: 40.08
        south: 39.75
        east: 116.62
        west: 116.15
      ring_name_patterns:
        - "东四环"
        - "西四环"
        - "南四环"
        - "北四环"
      exclude_name_patterns:
        - "辅路"
      retain_boundary_roads: true
      min_ring_segment_count: 60
      min_ring_total_length_km: 50
      min_ring_span_km: 12
      min_boundary_area_km2: 200
      max_boundary_area_km2: 450
      boundary_buffer_m: 80
      inside_length_ratio_threshold: 0.98
      boundary_tolerance_m: 5
      ring_overlap_tolerance_m: 20

crs:
  projected: "EPSG:32650"
  geographic: "EPSG:4326"

road_filter:
  keep_highway:
    - motorway
    - trunk
    - primary
    - secondary
    - tertiary
    - unclassified
    - residential
    - living_street
    - service
    - motorway_link
    - trunk_link
    - primary_link
    - secondary_link
    - tertiary_link
  exclude_highway:
    - footway
    - pedestrian
    - path
    - cycleway
    - steps
    - bridleway
    - corridor
    - construction
    - proposed
    - track
    - road
    - busway
  exclude_access_values:
    - "no"
    - private
    - agricultural
    - forestry
    - delivery
    - permit
    - customers
    - emergency
    - unknown
    - dismount
    - use_sidepath
  allow_access_values:
    - "yes"
    - permissive
    - destination
  allow_designated_access_columns:
    - taxi
    - motorcar
    - motor_vehicle
    - psv
  exclude_service_values:
    - parking_aisle
    - driveway
    - drive-through
    - emergency_access
  connector_highway:
    - motorway_link
    - trunk_link
    - primary_link
    - secondary_link
    - tertiary_link
  ordinary_highway:
    - motorway
    - trunk
    - primary
    - secondary
    - tertiary
    - unclassified
    - residential
    - living_street
    - service

connector_rules:
  max_connector_length_m: 120
  compress_short_connectors: true

continuity:
  same_name_bonus: 2.0
  same_osm_id_bonus: 1.5
  same_highway_bonus: 0.5
  angle_threshold_deg: 35

graph_weights:
  direct_adjacency_weight: 1.0
  connector_adjacency_weight: 0.8
  continuity_weight: 2.0

semantic_graph:
  poi:
    enabled: true
    input_path: "data/raw/beijing_poi_2017.csv"
    lon_column: "大地X"
    lat_column: "大地Y"
    category_column: "类型1"
    buffer_m: 100
    density_scale_per_km: true
  order:
    enabled: true
    input_path: "data/raw/beijing_order_201710.csv"
    start_time: "2017-10-16 00:00:00"
    end_time: "2017-10-23 00:00:00"
    chunksize: 200000
    max_match_distance_m: 250
    pickup_lon_column: "starting_lng"
    pickup_lat_column: "starting_lat"
    dropoff_lon_column: "dest_lng"
    dropoff_lat_column: "dest_lat"
    time_column: "departure_time"
    morning_peak_hours: [7, 8, 9, 10]
    evening_peak_hours: [17, 18, 19]
    night_hours: [0, 1, 2, 3, 4, 5, 6, 22, 23]
  similarity:
    poi_composition_weight: 0.7
    poi_density_weight: 0.2
    poi_entropy_weight: 0.1
  variants:
    road_only:
      poi_weight: 0.0
      order_weight: 0.0
    road_poi:
      poi_weight: 1.0
      order_weight: 0.0
    road_poi_order:
      poi_weight: 1.0
      order_weight: 1.0

order_pipeline:
  inputs:
    # Frozen canonical partition (see IntermediateDataForReproduce/README.md);
    # kept identical to stage1_partition.outputs.canonical_partition.
    partition_gpkg: "IntermediateDataForReproduce/segment_clusters_road_poi_order_regularized_leiden_lc1p0_lr1p0.gpkg"
    road_relation_edges_csv: "data/processed/fifth_ring/segment_relation_edges_road_poi_order.csv"
    order_datasets:
      - "data/raw/beijing_orders_2017-06_2017-08.csv"
    poi_path: "data/raw/beijing_poi_2017.csv"
  outputs:
    root: null
  keep_staging_db: false
  time_slot_minutes: 15
  order:
    chunksize: 500000
    max_match_distance_m: 250
    start_time: "2017-06-01 00:00:00"
    end_time: "2017-08-31 23:59:00"
    order_id_column: "order_id"
    driver_id_column: "driver_id"
    pickup_lon_column: "starting_lng"
    pickup_lat_column: "starting_lat"
    dropoff_lon_column: "dest_lng"
    dropoff_lat_column: "dest_lat"
    departure_time_column: "departure_time"
    finish_time_column: "finish_time"
  poi:
    lon_column: "大地X"
    lat_column: "大地Y"
    category_column: "类型1"
    max_match_distance_m: 100
    similarity_top_k: 10
  road_graph:
    weight_column: "base_weight"
  distance_graph:
    top_k: 10
    decay_distance_m: 3000.0
  graph_normalization:
    add_self_loops: true
    symmetric: true

evaluation:
  default_variant: "road_poi_order"

clustering:
  method: "louvain"
  algorithms:
    - louvain
    - leiden
    - skater
    - metis
    - demand_network_voronoi
    - demand_region_growing
  resolution: .8
  random_state: 42
  target_clusters: 137
  skater:
    dissimilarity: "inverse_weight"
  metis:
    balance_on: "segment_count"
    edge_weight_scale: 1000
  adaptive:
    seed_theta: 0.75
    capacity_min_ratio: 0.5
    capacity_max_ratio: 1.5
    edge_cost_epsilon: 1.0e-6
    alpha_conn: 1.0
    beta_poi: 0.5
    gamma_order: 0.5
    eta_continuity: 1.0
    lambda_capacity: 1.0
    lambda_shape: 0.2
    shape_distance_scale_m: 3000.0
    local_search_passes: 2
    local_search_tolerance: 1.0e-9
    lambda_cut: 1.0
    lambda_semantic_cut: 0.5
    lambda_local_capacity: 1.0

visualization:
  linewidth: 0.4
  figure_dpi: 300
  zoom_bounds:
    west: 116.35
    east: 116.45
    south: 39.88
    north: 39.96

# ============================================================================
# Unified three-stage pipeline configuration.
#
#   stage1_partition : spatial partitioning  (baselines + regularized search)
#   stage2_demand    : demand dataset        (currently the `order_pipeline`
#                      section above; renamed to stage2_demand in a later step)
#   stage3_supply    : supply-state reconstruction
#
# Reproducing the canonical result = run the stage scripts; changing parameters
# = edit this file. The committed baseline cluster gpkgs are treated as data
# inputs; the deterministic, reproducible core of stage 1 is the regularized
# search + selection initialized from the leiden baseline.
# ============================================================================

stage1_partition:
  graph_variant: road_poi_order
  baseline:
    # Baselines feed the regularized search as initializations / comparisons.
    # Their gpkgs are committed data inputs (see `regularized.baseline_clusters`).
    algorithms: [louvain, leiden, skater, metis, demand_network_voronoi, demand_region_growing]
    louvain_resolution: 0.522   # produced `..._louvain_res0p522.gpkg`
    leiden_resolution: 0.6      # produced `..._leiden_res0p6.gpkg`
    # remaining baseline params (random_state, target_clusters, skater, metis,
    # adaptive) are inherited from the top-level `clustering` section for now.
  regularized:
    initialization: leiden      # v2 selected initialization
    # All inputs are read from the frozen reproducibility snapshot so a re-run of
    # the (deterministic) regularized search always yields the canonical result,
    # independent of any regeneration of data/ or outputs/. See
    # IntermediateDataForReproduce/README.md.
    inputs:
      graph: IntermediateDataForReproduce/segment_relation_graph_road_poi_order.gpickle
      relation_edges: IntermediateDataForReproduce/segment_relation_edges_road_poi_order.csv
      classified_edges: IntermediateDataForReproduce/road_edges_classified.gpkg
      boundary: IntermediateDataForReproduce/beijing_fifth_ring_boundary.gpkg
      segment_nodes: IntermediateDataForReproduce/segment_nodes.gpkg
      poi_features: IntermediateDataForReproduce/segment_poi_features.csv
      order_features: IntermediateDataForReproduce/segment_order_features.csv
      hourly_od: IntermediateDataForReproduce/segment_order_od_hourly.csv
    baseline_clusters:
      louvain: IntermediateDataForReproduce/segment_clusters_road_poi_order_louvain_res0p522.gpkg
      leiden: IntermediateDataForReproduce/segment_clusters_road_poi_order_leiden_res0p6.gpkg
      demand_region_growing: IntermediateDataForReproduce/segment_clusters_road_poi_order_demand_region_growing.gpkg
    objective:
      target_clusters: 100
      capacity_loss: squared_hinge
      capacity_min_ratio: 0.5
      capacity_max_ratio: 1.5
      lambda_g: 1.0
      lambda_r: 1.0
      alpha_cont: 1.0
      alpha_conn: 1.0
      grid:
        lambda_c: [1.0]
        lambda_r: [1.0]
        alpha_cont: [1.0]
        alpha_conn: [1.0]
    search:
      max_passes: 5
      min_delta: 1.0e-9
      move_policy: best_improving
      enforce_connectivity: true
      allow_merge_split: false
      max_merge_candidates: 8
      max_merge_targets_per_cluster: 3
      max_split_candidates: 8
      split_cleanup_passes: 2
      grid:
        merge_split_enabled: [false, true]
    evaluation:
      thresholds:
        small_cluster_min_segments: 5
        small_cluster_min_length_m: 1000.0
        small_cluster_min_orders: 100.0
        min_order_total: 100.0
        capacity_min_ratio: 0.5
        capacity_max_ratio: 1.5
        effective_od_min_flow: 10.0
        elongation_threshold: 10.0
        large_diameter_threshold_m: 30000.0
        geometry_buffer_m: 50.0
      pareto_pairs:
        - {name: od_sparsity_vs_continuity_cut, x: od_sparsity, y: continuity_edge_cut_ratio, x_direction: min, y_direction: min}
        - {name: order_cv_vs_connector_cut, x: order_count_cv, y: connector_edge_cut_ratio, x_direction: min, y_direction: min}
        - {name: capacity_hinge_vs_continuity_cut, x: capacity_hinge_loss, y: continuity_edge_cut_ratio, x_direction: min, y_direction: min}
        - {name: wape_vs_road_integrity, x: historical_avg_wape, y: weighted_mean_road_name_num_clusters, x_direction: min, y_direction: min}
        - {name: network_diameter_vs_od_sparsity, x: mean_network_diameter_m, y: od_sparsity, x_direction: min, y_direction: min}
      selection_tolerances:
        od_sparsity_max_relative_degradation: 0.02
        structure_cut_max_relative_degradation: 0.10
        shape_max_relative_degradation: 0.10
    visualization:
      output_dir: regularized_zoning_experiments/runs/v2_fifth_ring_road_poi_order_lc1_lr1_k100/figures
      dpi: 300
      map_size_px: 2400
      panel_map_size_px: 1500
      linewidth: 0.45
      cluster_palette_strategy: adjacency_contrast
      cluster_line_halo: true
      cluster_line_halo_multiplier: 2.5
      connector_alpha: 70
      min_color_distance: 90.0
      baseline_algorithms: [louvain, demand_region_growing]
      comparison_algorithms: [louvain, leiden, demand_region_growing]
      best_selection:
        require_connected: true
        require_exact_target_clusters: true
        require_pareto_non_dominated: true
        target_clusters: 100
        pareto_metrics: [od_sparsity, order_count_cv, capacity_hinge_loss, continuity_edge_cut_ratio, connector_edge_cut_ratio, mean_network_diameter_m, historical_avg_wape]
        metrics:
          od_sparsity: 0.20
          order_capacity_balance: 0.20
          continuity_edge_cut_ratio: 0.20
          connector_edge_cut_ratio: 0.20
          mean_network_diameter_m: 0.10
          historical_avg_wape: 0.10
      tradeoff_pairs:
        - {name: od_sparsity_vs_continuity_cut, x: od_sparsity, y: continuity_edge_cut_ratio, x_label: OD sparsity, y_label: Continuity cut ratio}
        - {name: order_cv_vs_connector_cut, x: order_count_cv, y: connector_edge_cut_ratio, x_label: Order capacity CV, y_label: Connector cut ratio}
        - {name: capacity_hinge_vs_continuity_cut, x: capacity_hinge_loss, y: continuity_edge_cut_ratio, x_label: Capacity hinge loss, y_label: Continuity cut ratio}
        - {name: wape_vs_road_integrity, x: historical_avg_wape, y: weighted_mean_road_name_num_clusters, x_label: Historical average WAPE, y_label: Weighted mean road-name clusters}
        - {name: network_diameter_vs_od_sparsity, x: mean_network_diameter_m, y: od_sparsity, x_label: Mean network diameter (m), y_label: OD sparsity}
      heatmap_metrics: [od_sparsity, connector_edge_cut_ratio, continuity_edge_cut_ratio, order_count_cv, capacity_hinge_loss, balanced_score]
      core_metric_comparison: [continuity_edge_cut_ratio, connector_edge_cut_ratio, od_sparsity, order_count_cv, capacity_hinge_loss, historical_avg_wape]
      zoom_bounds: {west: 116.35, east: 116.45, south: 39.88, north: 39.96}
  outputs:
    # Stage 1 re-runs write regenerated artifacts here (for verification only).
    run_root: regularized_zoning_experiments/runs/v2_fifth_ring_road_poi_order_lc1_lr1_k100
    # The trusted, frozen partition consumed by Stage 2. A re-run's regenerated
    # output under run_root should be verified equal to this file, never overwrite it.
    canonical_partition: IntermediateDataForReproduce/segment_clusters_road_poi_order_regularized_leiden_lc1p0_lr1p0.gpkg

stage3_supply:
  orders_path: data/processed/fifth_ring/order_pipeline/orders_region_assigned.csv.gz
  output_dir: data/processed/fifth_ring/supply
  demand_path: data/processed/fifth_ring/order_pipeline/cluster_od_15min.csv
  demand_dir: data/processed/fifth_ring/demand
  max_gap_minutes: 60        # chain-formation gap (minutes): trips farther apart start a new driver chain
  tau_idle_minutes: 30       # idle-judgement cap (minutes): a gap shorter than this counts as online-idle -> available. DISTINCT from max_gap_minutes (do not couple them)
  carpool_merge_gap_s: 0
  slot_duration_min: 15
  n_blocks: 8                 # number of per-driver chunks for the chunked supply reconstruction
  peak_morning_hours: [7, 8, 9, 10]
  peak_evening_hours: [17, 18, 19]

# ============================================================================
# Stage 4 - trip-time (TTE) dataset. Builds a (time slot x OD) median trip-time
# matrix from the Stage 2 assigned orders + cluster centroids, then fills gaps
# with transitive (corridor) imputation. Depends only on Stage 2 outputs.
# ============================================================================
stage4_tte:
  inputs:
    # Both are Stage 2 (order_pipeline) products under data/processed/<scope>/.
    orders_path: data/processed/fifth_ring/order_pipeline/orders_region_assigned.csv.gz
    cluster_index_path: data/processed/fifth_ring/order_pipeline/cluster_index.csv
  output_dir: data/processed/fifth_ring/tte
  outputs:
    # Per-cell observation-count matrix aligned with TTE_raw (count>=1 iff observed).
    count_filename: "TTE_count.parquet"
    # Provenance of the multi-hop imputation, aligned 1:1 with TTE_raw:
    #   hops    - 0=observed, r=filled at hop r, -1=unfilled.
    #   support - inferred cells: weakest path support (min obs count); -1 elsewhere.
    hops_filename: "TTE_hops.parquet"
    support_filename: "TTE_support.parquet"
  distance:
    # Cluster-to-cluster road-network shortest-path distance (metres) between each
    # cluster's representative OSM node (nearest junction to its centroid). Replaces
    # centroid Haversine in the SpatialPruner. Built once and cached on first run.
    matrix_filename: "cluster_network_distance.parquet"
    representatives_filename: "cluster_representative_nodes.csv"
    recompute: false               # if the matrix file exists and false -> load it
    graphml_path: "data/raw/beijing_drive_within_fifth_ring.graphml"
    # Frozen snapshot (same provenance as the canonical partition below).
    classified_edges_path: "IntermediateDataForReproduce/road_edges_classified.gpkg"
    partition_gpkg: "IntermediateDataForReproduce/segment_clusters_road_poi_order_regularized_leiden_lc1p0_lr1p0.gpkg"
  time:
    freq: "10min"                     # slot width; matches KoopmanTTE's TIME_FREQ for comparable coverage
    start_time: "2017-06-01 00:00:00"
    end_time: "2017-08-31 23:59:00"   # aligned with order_pipeline time window
  trip_time:
    # trip_time = finish_time - departure_time (minutes); rows outside the band
    # or with an out-of-scope endpoint are dropped before aggregation.
    min_minutes: 3                    # 3-80 min band matches KoopmanTTE's trip_time filter
    max_minutes: 80
    aggregation: median               # per-cell aggregation of trips sharing a (slot, OD)
  keep_place:
    # Keep clusters seen as both origin and destination at least this many times.
    min_origin_orders: 1
    min_dest_orders: 1
  imputation:
    method: transitive          # transitive corridor imputation only (no discrete-DP)
    max_hops: 3                 # multi-hop min-plus depth cap (hop r == iteration round). Bounds compute,
                                #   and regularizes optimizer's curse: limits how many layers the per-corridor
                                #   min-selection of downward-biased estimates can compound.
    source_min_count: 1         # edge-level gate k: an observed cell may serve as a transitive *leg* only if count>=k.
                                #   k=1 = no source gate (maximize coverage, aligned with KoopmanTTE). k only gates
                                #   sources, never targets: thin observations are kept verbatim, and the weakest
                                #   support of each fill is recorded in TTE_support for downstream confidence
                                #   weighting (not yet implemented). Raising k trades coverage for bound quality.
    detour_ratio: 1.3           # corridor admissibility eta: keep k iff d(O,k)+d(k,D) <= eta*d(O,D).
                                #   With network distance the feasible region is a detour-ratio band, not an ellipse.
    speed_limit_kmh: [5, 120]   # validate_estimates: reject fills implying speed outside this band (curse guard)
    min_dist_km: 0.01
    window: 6                   # rolling-outlier window (slots) for validate_estimates
    outlier_std_threshold: 3
    use_validation: true
