schema_version: 1
project_root: ../..
scope: fifth_ring

run:
  root: ../../outputs/runs
  isolate_stages: true

stages:
  # Fixed order and runtime bindings are owned by the runner; stage fallback
  # paths are used only by standalone commands.
  partition:
    config: ../zoning/regularized.yaml
    required: true
  demand:
    config: demand.yaml
    required: true
  supply:
    config: supply.yaml
    required: true
  tte:
    config: tte.yaml
    required: true
