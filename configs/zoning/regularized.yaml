schema_version: 1
dataset_config: ../datasets/fifth_ring.yaml
scope: fifth_ring

contract:
  verify_canonical: true
  expected_partition: ../../artifacts/golden/beijing-fifth-ring-v1/expected/partition/segment_clusters_road_poi_order_regularized_leiden_lc1p0_lr1p0.gpkg

stage1_partition:
  graph_variant: road_poi_order
  regularized:
    initialization: leiden
    inputs:
      graph: ../../data/interim/fifth_ring/frozen_inputs/segment_relation_graph_road_poi_order.gpickle
      relation_edges: ../../data/interim/fifth_ring/frozen_inputs/segment_relation_edges_road_poi_order.csv
      classified_edges: ../../data/interim/fifth_ring/road_edges_classified.gpkg
      boundary: ../../data/raw/beijing_fifth_ring_boundary.gpkg
      segment_nodes: ../../data/interim/fifth_ring/frozen_inputs/segment_nodes.gpkg
      poi_features: ../../data/interim/fifth_ring/frozen_inputs/segment_poi_features.csv
      order_features: ../../data/interim/fifth_ring/frozen_inputs/segment_order_features.csv
      hourly_od: ../../data/interim/fifth_ring/frozen_inputs/segment_order_od_hourly.csv
    baseline_clusters:
      louvain: ../../artifacts/golden/beijing-fifth-ring-v1/legacy_comparisons/louvain/segment_clusters_road_poi_order_louvain_res0p522.gpkg
      leiden: ../../artifacts/golden/beijing-fifth-ring-v1/inputs/segment_clusters_road_poi_order_leiden_res0p6.gpkg
      demand_region_growing: ../../artifacts/golden/beijing-fifth-ring-v1/legacy_comparisons/demand_region_growing/segment_clusters_road_poi_order_demand_region_growing.gpkg
    objective:
      target_clusters: 100
      capacity_loss: squared_hinge
      capacity_min_ratio: 0.5
      capacity_max_ratio: 1.5
      lambda_g: 1.0
      lambda_r: 1.0
      alpha_cont: 1.0
      alpha_conn: 1.0
      grid:
        lambda_c: [1.0]
        lambda_r: [1.0]
        alpha_cont: [1.0]
        alpha_conn: [1.0]
    search:
      max_passes: 5
      min_delta: 1.0e-9
      move_policy: best_improving
      enforce_connectivity: true
      allow_merge_split: false
      max_merge_candidates: 8
      max_merge_targets_per_cluster: 3
      max_split_candidates: 8
      split_cleanup_passes: 2
      # This is the effective canonical Stage 1 value after the legacy wrapper's
      # build_regularized_config adapter, not the wider experiment grid in config.yaml.
      grid:
        merge_split_enabled: [false]
  outputs:
    # Compatibility alias for the explicit read-only contract above; stage
    # execution still writes only to its owned run directory.
    canonical_partition: ../../artifacts/golden/beijing-fifth-ring-v1/expected/partition/segment_clusters_road_poi_order_regularized_leiden_lc1p0_lr1p0.gpkg

standalone:
  output_dir: ../../outputs/runs
