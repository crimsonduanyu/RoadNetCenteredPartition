schema_version: 1
dataset_config: ../datasets/fifth_ring.yaml
scope: fifth_ring

contract:
  verify_canonical: false
  expected_partition: null

stage1_partition:
  graph_variant: road_poi_order
  regularized:
    initialization: leiden
    inputs:
      # Standalone placeholders. Full runs bind run-owned preparation outputs.
      graph: ../../outputs/preparation/segment_relation_graph_road_poi_order.graph.json.gz
      relation_edges: ../../outputs/preparation/segment_relation_edges_road_poi_order.csv
      classified_edges: ../../outputs/preparation/road_edges_classified.gpkg
      boundary: ../../data/raw/beijing_fifth_ring_boundary.gpkg
      segment_nodes: ../../outputs/preparation/segment_nodes.gpkg
      poi_features: ../../outputs/preparation/segment_poi_features.csv
      order_features: ../../outputs/preparation/segment_order_features.csv
      hourly_od: ../../outputs/preparation/segment_order_od_hourly.csv
    baseline_clusters:
      leiden: ../../outputs/preparation/segment_clusters_road_poi_order_leiden_res0p6.gpkg
    objective:
      target_clusters: 100
      capacity_loss: squared_hinge
      capacity_min_ratio: 0.5
      capacity_max_ratio: 1.5
      lambda_g: 1.0
      lambda_r: 1.0
      alpha_cont: 1.0
      alpha_conn: 1.0
      grid:
        lambda_c: [1.0]
        lambda_r: [1.0]
        alpha_cont: [1.0]
        alpha_conn: [1.0]
    search:
      max_passes: 5
      min_delta: 1.0e-9
      move_policy: best_improving
      enforce_connectivity: true
      allow_merge_split: false
      max_merge_candidates: 8
      max_merge_targets_per_cluster: 3
      max_split_candidates: 8
      split_cleanup_passes: 2
      # This is the effective canonical Stage 1 value after the legacy wrapper's
      # build_regularized_config adapter, not the wider experiment grid in config.yaml.
      grid:
        merge_split_enabled: [false]
  outputs:
    canonical_partition: null

standalone:
  output_dir: ../../outputs/runs
